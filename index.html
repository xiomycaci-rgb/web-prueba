<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dangus Studio · Diseño web estrategico</title>
  <style>
    :root {
      --fondo: #f6f1ea;
      --tinta: #2b2623;
      --suave: #7a6f66;
      --acento: #a67c52;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--fondo);
      color: var(--tinta);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }
    main { max-width: 560px; }
    .sello {
      letter-spacing: .3em;
      text-transform: uppercase;
      font-size: .75rem;
      color: var(--acento);
    }
    h1 {
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 3.2rem);
      margin: 16px 0;
    }
    p { color: var(--suave); line-height: 1.7; }
    a.boton {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border: 1px solid var(--tinta);
      color: var(--tinta);
      text-decoration: none;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: .8rem;
    }
    a.boton:hover { background: var(--tinta); color: var(--fondo); }
  </style>
</head>
<body>
  <main>
    <div class="sello">Dangus Studio</div>
    <h1>Diseño web estratégico</h1>
    <p>Si estás leyendo esto desde una dirección de Vercel, el circuito
       GitHub y Vercel ya funciona. Cada cambio que subas a GitHub
       se publicará aquí automáticamente.</p>
    <a class="boton" href="#">Botón de prueba</a>
  </main>
</body>
</html>
